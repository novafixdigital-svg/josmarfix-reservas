<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOSMARFIX RESERVAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a0e27;color:#fff;min-height:100vh}
.header{text-align:center;padding:30px 20px 10px}
.header img{width:120px;border-radius:50%;border:3px solid #00ff88;margin-bottom:10px}
.header h1{font-size:1.8rem;color:#00ff88;text-shadow:0 0 20px rgba(0,255,136,0.3)}
.header p{color:#00e5ff;margin-top:5px;font-size:0.95rem}
.container{max-width:500px;margin:20px auto;padding:0 20px 40px}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(0,229,255,0.2);border-radius:16px;padding:25px;margin-bottom:20px}
.card h2{color:#00e5ff;font-size:1.1rem;margin-bottom:15px;text-align:center}
label{display:block;color:#aaa;font-size:0.85rem;margin-bottom:5px;margin-top:12px}
select,input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(0,229,255,0.3);background:#111638;color:#fff;font-size:1rem;outline:none}
select:focus,input:focus{border-color:#00ff88;box-shadow:0 0 10px rgba(0,255,136,0.2)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:1.1rem;font-weight:700;cursor:pointer;margin-top:20px;transition:all 0.3s}
.btn-reservar{background:linear-gradient(135deg,#00ff88,#00e5ff);color:#0a0e27}
.btn-reservar:hover{transform:scale(1.02);box-shadow:0 0 25px rgba(0,255,136,0.4)}
.btn-reservar:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:100;justify-content:center;align-items:center}
.modal-overlay.activo{display:flex}
.modal{background:#111638;border:2px solid #00ff88;border-radius:20px;padding:30px;max-width:400px;width:90%;text-align:center}
.modal h3{color:#00ff88;font-size:1.3rem;margin-bottom:10px}
.modal p{color:#ccc;margin:8px 0;font-size:0.95rem}
.modal .id{color:#00e5ff;font-weight:700;font-size:1.1rem}
.modal .btn-cerrar{background:#00ff88;color:#0a0e27;padding:10px 30px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:15px}
.error-msg{background:rgba(255,50,50,0.15);border:1px solid #ff3232;color:#ff6b6b;padding:12px;border-radius:10px;text-align:center;margin-top:15px;display:none;font-size:0.9rem}
.loading{display:none;text-align:center;padding:20px;color:#00e5ff}
.loading.activo{display:block}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid rgba(0,229,255,0.3);border-top-color:#00ff88;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.qr-section{text-align:center;margin-top:20px}
.qr-section img{border-radius:12px;border:2px solid #00ff88}
.qr-section p{color:#aaa;font-size:0.8rem;margin-top:8px}
</style>
</head>
<body>

<div class="header">
  <img src="robot_josmarfix.png" alt="JOSMARFIX Robot">
  <h1>JOSMARFIX RESERVAS</h1>
  <p>Agencia de Inteligencia Artificial</p>
</div>

<div class="container">
  <div class="card">
    <h2>📅 Reserva tu cita</h2>

    <label>Servicio</label>
    <select id="servicio">
      <option value="">-- Elige un servicio --</option>
      <option value="Videos promocionales IA">Videos promocionales IA</option>
      <option value="Chatbot personalizado IA">Chatbot personalizado IA</option>
      <option value="Automatizacion de procesos">Automatización de procesos</option>
      <option value="Asistente virtual IA">Asistente virtual IA</option>
      <option value="Edicion de imagenes IA">Edición de imágenes IA</option>
      <option value="Consultoria IA">Consultoría IA</option>
    </select>

    <label>Fecha</label>
    <input type="date" id="fecha">

    <label>Hora</label>
    <select id="hora">
      <option value="">-- Elige una hora --</option>
      <option value="09:00">09:00</option>
      <option value="09:30">09:30</option>
      <option value="10:00">10:00</option>
      <option value="10:30">10:30</option>
      <option value="11:00">11:00</option>
      <option value="11:30">11:30</option>
      <option value="12:00">12:00</option>
      <option value="12:30">12:30</option>
      <option value="13:00">13:00</option>
      <option value="13:30">13:30</option>
      <option value="16:00">16:00</option>
      <option value="16:30">16:30</option>
      <option value="17:00">17:00</option>
      <option value="17:30">17:30</option>
      <option value="18:00">18:00</option>
      <option value="18:30">18:30</option>
      <option value="19:00">19:00</option>
      <option value="19:30">19:30</option>
    </select>

    <label>Nombre completo</label>
    <input type="text" id="nombre" placeholder="Ej: José García">

    <label>Teléfono</label>
    <input type="tel" id="telefono" placeholder="Ej: 631039247">

    <button class="btn btn-reservar" id="btnReservar" onclick="hacerReserva()">🚀 RESERVAR AHORA</button>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Procesando tu reserva...</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="card qr-section">
    <h2>📱 Comparte esta web</h2>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&color=00ff88&bgcolor=0a0e27&data=https://novafixdigital-svg.github.io/josmarfix-reservas/" alt="QR">
    <p>Escanea para abrir en el móvil</p>
  </div>
</div>

<div class="modal-overlay" id="modalExito">
  <div class="modal">
    <h3>✅ ¡Reserva Confirmada!</h3>
    <p>Tu ID de reserva:</p>
    <p class="id" id="reservaId"></p>
    <p id="reservaDetalles"></p>
    <button class="btn-cerrar" onclick="cerrarModal()">ENTENDIDO</button>
  </div>
</div>

<script>
var URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbwD4vw5VpQCD4Y2z4MQ74R6uIFwRg7i7YQG88vVuDKzpOMGrEddiemn96TfW9UK7hRwVQ/exec';

function formatearFecha(iso) {
  var p = iso.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}

function mostrarError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, 8000);
}

function mostrarLoading() {
  document.getElementById('loading').classList.add('activo');
  document.getElementById('btnReservar').disabled = true;
}

function ocultarLoading() {
  document.getElementById('loading').classList.remove('activo');
  document.getElementById('btnReservar').disabled = false;
}

function hacerReserva() {
  document.getElementById('errorMsg').style.display = 'none';

  var servicio = document.getElementById('servicio').value;
  var fechaISO = document.getElementById('fecha').value;
  var hora = document.getElementById('hora').value;
  var nombre = document.getElementById('nombre').value.trim();
  var telefono = document.getElementById('telefono').value.trim();

  if (!servicio || !fechaISO || !hora || !nombre || !telefono) {
    mostrarError('⚠️ Completa todos los campos.');
    return;
  }

  var fecha = formatearFecha(fechaISO);
  var id = 'JF-' + Date.now();
  var cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 99999);
  var script = document.createElement('script');
  var timer = null;

  function limpiar() {
    if (timer) clearTimeout(timer);
    delete window[cbName];
    if (script.parentNode) script.parentNode.removeChild(script);
  }

  mostrarLoading();

  timer = setTimeout(function() {
    limpiar();
    ocultarLoading();
    mostrarError('❌ El servidor tardó demasiado. Intenta de nuevo.');
  }, 15000);

  window[cbName] = function(data) {
    limpiar();
    ocultarLoading();

    if (data && data.error) {
      mostrarError('🚫 ' + data.mensaje);
      return;
    }

    if (data && data.ok) {
      document.getElementById('reservaId').textContent = data.id;
      document.getElementById('reservaDetalles').textContent =
        '📅 ' + fecha + ' a las ' + hora + ' | 🔧 ' + servicio + ' | 👤 ' + nombre;
      document.getElementById('modalExito').classList.add('activo');
      document.getElementById('servicio').value = '';
      document.getElementById('fecha').value = '';
      document.getElementById('hora').value = '';
      document.getElementById('nombre').value = '';
      document.getElementById('telefono').value = '';
      return;
    }

    mostrarError('❌ Respuesta inesperada del servidor.');
  };

  var url = URL_SCRIPT
    + '?fecha=' + encodeURIComponent(fecha)
    + '&hora=' + encodeURIComponent(hora)
    + '&servicio=' + encodeURIComponent(servicio)
    + '&nombre=' + encodeURIComponent(nombre)
    + '&telefono=' + encodeURIComponent(telefono)
    + '&id=' + encodeURIComponent(id)
    + '&callback=' + cbName;

  script.src = url;
  script.onerror = function() {
    limpiar();
    ocultarLoading();
    mostrarError('❌ Error de conexión. Revisa tu internet.');
  };
  document.head.appendChild(script);
}

function cerrarModal() {
  document.getElementById('modalExito').classList.remove('activo');
}

(function() {
  var hoy = new Date();
  var y = hoy.getFullYear();
  var m = String(hoy.getMonth() + 1).padStart(2, '0');
  var d = String(hoy.getDate()).padStart(2, '0');
  document.getElementById('fecha').setAttribute('min', y + '-' + m + '-' + d);
})();
</script>

</body>
</html>
